services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./examples:/app/examples
      - ./reports:/app/reports

  cli:
    build: .
    env_file: .env
    volumes:
      - ./examples:/app/examples
      - ./reports:/app/reports
    entrypoint: ["python", "main.py"]
    profiles: ["cli"]
